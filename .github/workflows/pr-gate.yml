# Managed from AloysJehwin/Jeffi_Stores (oss/templates); changes here are overwritten by the next export.
#
# Runs from main's copy of this file (pull_request_target), so a PR can't change it, and it never checks out or
# runs PR code. On new commits it drops `ok-to-test`, so checks only ever run on code a maintainer has looked at.
# On `ok-to-test` it adds the "Guard" status (required): a PR may not change the files this repo gets from
# AloysJehwin/Jeffi_Stores (.github/, LICENSE, and oss/ in workspace), including this workflow.
name: PR gate

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]

permissions: {}

jobs:
  unlabel:
    name: Drop ok-to-test on new commits
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'ok-to-test'; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/ok-to-test" > /dev/null
            echo "Removed ok-to-test: the new commits need a maintainer's look before checks run again."
          else
            echo "No ok-to-test label to remove."
          fi

  guard:
    name: ${{ github.event.label.name == 'ok-to-test' && 'Guard' || 'Guard · not requested' }}
    if: github.event.action == 'labeled' && github.event.label.name == 'ok-to-test'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Managed files are untouched
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" != main ]; then echo "::error::PRs go to main (this one targets $BASE)."; exit 1; fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          pattern='^(\.github/|LICENSE$)'
          if [ "$NAME" = workspace ]; then pattern='^(\.github/|LICENSE$|oss/)'; fi
          if grep -E "$pattern" files.txt; then
            echo "::error::This PR changes files that come from AloysJehwin/Jeffi_Stores (listed above). Revert them here and describe the change in an issue instead."
            exit 1
          fi
          echo "OK: $(wc -l < files.txt | tr -d ' ') files changed, none of them managed."
